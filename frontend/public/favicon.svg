<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- CandiTrack: linha de progresso subindo, sobre o azul de destaque -->
  <style>
    .fundo { fill: #1D5FD1; }
    .traco { stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .fundo { fill: #6FA3FF; }
      .traco { stroke: #0C1220; }
    }
  </style>
  <rect class="fundo" x="1" y="1" width="30" height="30" rx="8"/>
  <g class="traco" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="7,21 12.5,15.5 16.5,19 24,11"/>
    <polyline points="18.5,11 24,11 24,16.5"/>
  </g>
</svg>
