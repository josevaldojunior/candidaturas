@if (telaDeLogin()) {
  <!-- login/cadastro: tela cheia, sem menu -->
  <router-outlet />
} @else {
  <mat-sidenav-container class="container">
    <mat-sidenav #sidenav class="menu-lateral"
                 [mode]="celular() ? 'over' : 'side'"
                 [opened]="!celular()"
                 [fixedInViewport]="celular()">
      <a class="marca" routerLink="/dashboard" aria-label="CandiTrack: ir para o Dashboard" (click)="fecharSeCelular(sidenav)">
        <app-logo />
      </a>
      <mat-nav-list>
        @for (item of menu; track item.rota) {
          <a mat-list-item [routerLink]="item.rota" routerLinkActive="ativo" #rla="routerLinkActive"
             [activated]="rla.isActive" (click)="fecharSeCelular(sidenav)">
            <mat-icon matListItemIcon>{{ item.icone }}</mat-icon>
            <span matListItemTitle>{{ item.rotulo }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="conteudo">
      <!-- barra superior: no celular traz o menu; nos dois tamanhos tema e conta ficam no canto direito -->
      <mat-toolbar class="barra-topo" [class.compacta]="!celular()">
        @if (celular()) {
          <button mat-icon-button aria-label="Abrir menu" (click)="sidenav.toggle()">
            <mat-icon>menu</mat-icon>
          </button>
          <a class="marca-topo" routerLink="/dashboard" aria-label="CandiTrack: ir para o Dashboard">
            <app-logo [tamanho]="24" />
          </a>
        }
        <span class="flex-espaco"></span>
        <app-seletor-tema />
        @if (sessao.usuario(); as u) {
          <button mat-button class="conta" [matMenuTriggerFor]="menuConta" [attr.aria-label]="'Conta de ' + u.nome">
            <mat-icon>account_circle</mat-icon>
            @if (!celular()) { <span class="nome">{{ u.nome }}</span> }
          </button>
          <mat-menu #menuConta="matMenu" xPosition="before">
            <div class="conta-dados" mat-menu-item disabled>
              <strong>{{ u.nome }}</strong>
              <span>{{ u.email }}</span>
            </div>
            <a mat-menu-item routerLink="/configuracoes"><mat-icon>settings</mat-icon> Configurações</a>
            <button mat-menu-item (click)="sessao.sair()"><mat-icon>logout</mat-icon> Sair</button>
          </mat-menu>
        }
      </mat-toolbar>
      <main>
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
