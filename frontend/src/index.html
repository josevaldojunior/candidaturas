<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CandiTrack</title>
  <meta name="description" content="CandiTrack: acompanhe suas candidaturas a vagas com quadro, follow-ups e dashboard.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1222" media="(prefers-color-scheme: dark)">
  <!-- aplica o tema salvo antes do Angular carregar, para a página não piscar no tema errado -->
  <script>(function(){try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
