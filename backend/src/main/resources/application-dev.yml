# Perfil dev: H2 em arquivo (./data), sem precisar de PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:file:./data/candidaturas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  inbox:
    # a mesma pasta inbox da raiz do projeto
    dir: ${INBOX_DIR:../inbox}
