server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: candidaturas-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/candidaturas}
    username: ${DB_USER:candidaturas}
    password: ${DB_PASSWORD:candidaturas}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo
    deserialization:
      accept-single-value-as-array: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  zona: America/Sao_Paulo
  agendamento:
    habilitado: true
  sem-retorno:
    # todo dia às 18:00 (horário de Brasília), para cada conta
    cron: "0 0 18 * * *"
  inbox:
    dir: ${INBOX_DIR:./inbox}
    # e-mail da conta que recebe os CSVs da pasta; vazio desliga a leitura automática
    usuario: ${INBOX_USUARIO:}
    # a cada 5 minutos
    intervalo-ms: 300000
    atraso-inicial-ms: 30000
  cors:
    # origens do frontend, separadas por vírgula
    origens: ${CORS_ORIGENS:http://localhost:4200}
  seguranca:
    # segredo do JWT; obrigatório em produção (sem ele, os logins expiram a cada reinício)
    jwt-segredo: ${JWT_SEGREDO:}
    sessao-horas: ${SESSAO_HORAS:12}
    # false: só a primeira conta pode ser criada (instalação de uso pessoal)
    cadastro-aberto: ${CADASTRO_ABERTO:true}
