name: candidaturas

# Sobe banco, API e frontend. Configure as variáveis num arquivo .env (veja .env.example).
# JWT_SEGREDO é obrigatório: sem ele o compose não sobe.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidaturas
      POSTGRES_USER: candidaturas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-candidaturas}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidaturas -d candidaturas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/candidaturas
      DB_USER: candidaturas
      DB_PASSWORD: ${DB_PASSWORD:-candidaturas}
      JWT_SEGREDO: ${JWT_SEGREDO:?Defina JWT_SEGREDO no .env (veja .env.example)}
      SESSAO_HORAS: ${SESSAO_HORAS:-12}
      CADASTRO_ABERTO: ${CADASTRO_ABERTO:-true}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:4200}
      INBOX_DIR: /app/inbox
      INBOX_USUARIO: ${INBOX_USUARIO:-}
    volumes:
      # pasta de CSVs lida a cada 5 minutos para a conta INBOX_USUARIO (./inbox ao lado deste arquivo)
      - ./inbox:/app/inbox
    ports:
      # exposta para agentes locais chamarem a API direto; num servidor, pode ficar só atrás do frontend
      - "${API_PORTA:-8080}:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORTA:-4200}:80"

volumes:
  postgres-data:
