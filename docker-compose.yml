name: candidaturas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidaturas
      POSTGRES_USER: candidaturas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-candidaturas}
      TZ: America/Sao_Paulo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidaturas -d candidaturas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/candidaturas
      DB_USER: candidaturas
      DB_PASSWORD: ${DB_PASSWORD:-candidaturas}
      # opcional: quando definido, o agente precisa mandar o header X-Integracao-Token
      INTEGRACAO_TOKEN: ${INTEGRACAO_TOKEN:-}
      INBOX_DIR: /app/inbox
    volumes:
      # pasta onde o agente deixa os CSVs (./inbox ao lado deste arquivo)
      - ./inbox:/app/inbox
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  postgres-data:
